spring:
  kafka:
    producer:
      value-serializer: "org.springframework.kafka.support.serializer.JsonSerializer"
      key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
    consumer:
      group-id: "midas-group"
      auto-offset-reset: "earliest"
      value-deserializer: "org.springframework.kafka.support.serializer.JsonDeserializer"
      key-deserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      properties:
        spring.json.value.trusted.packages: "com.jpmc.midascore.foundation.*"
        spring.json.value.default.type: "com.jpmc.midascore.foundation.Transaction"
      datasource:
        url: "jdbc:h2:mem:midas"
        driverClassName: "org.h2.Driver"
        username: "sa"
        password: "password"
      jpa:
        hibernate:
          ddl-auto: "update"
        show-sql: true
        database-platform: "org.hibernate.dialect.H2Dialect"
general:
  kafka-topic: "midas-transactions"
server:
  port: 33400